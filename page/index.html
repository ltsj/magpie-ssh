<!doctype html>
<html lang="zh">

<head>
  <meta charset="utf-8">
  <title>SSH 主机</title>
  <link rel="stylesheet" href="style.css">
  <script src="_magpie/bridge.js"></script>
  <script src="app.js" defer></script>
</head>

<body>
  <h1>SSH 主机</h1>
  <p class="lead">主机和凭据存在插件自己的设置里（<code>plugins.json</code>，明文），agent 通过 <code>magpie-ssh_run</code> 等工具调用，不经过这里。</p>

  <form id="form" autocomplete="off">
    <div class="grid">
      <label>名称<input id="f-name" placeholder="prod-web" required></label>
      <label>主机<input id="f-host" placeholder="1.2.3.4 或 example.com" required></label>
      <label>端口<input id="f-port" type="number" min="1" max="65535" placeholder="22"></label>
      <label>用户<input id="f-user" placeholder="root"></label>
      <label class="wide">密码（留空用私钥或 ssh agent）<input id="f-pw" type="password" autocomplete="new-password"></label>
      <label class="wide">私钥（留空用 ssh agent / ~/.ssh 里的默认身份）<input id="f-key" placeholder="~/.ssh/id_ed25519"></label>
      <label>主机指纹校验
        <select id="f-strict">
          <option value="accept-new">accept-new（首次信任，变了就拒）</option>
          <option value="no">不校验（不安全，谁都能冒充这台主机）</option>
          <option value="yes">yes（必须在 known_hosts 里）</option>
        </select>
      </label>
      <label class="wide">备注<input id="f-note" placeholder="任意说明，只给自己看"></label>
    </div>
    <div class="actions">
      <button id="submit" type="submit">添加</button>
      <button id="cancel" type="button" hidden>取消编辑</button>
      <span id="status" class="status"></span>
    </div>
  </form>

  <ul id="list" class="list"></ul>
  <p id="empty" class="empty">还没有主机。</p>
</body>

</html>
