name: ci

on:
  push:
    branches: [master]
  pull_request:

jobs:
  test:
    # engines 说的是 node >= 18，Windows 上还有单独的分支（ssh-agent 管道、路径大小写不敏感），
    # 只跑一个组合等于没测这些分支
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
        node: [18, 20, 22]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v5
      - uses: pnpm/action-setup@v6
        with:
          version: 10
      - uses: actions/setup-node@v5
        with:
          node-version: ${{ matrix.node }}
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: node test/smoke.mjs
      # 进程内起真服务端再跑一遍：SFTP（put/get）和 exec（run）各一个文件
      - run: node test/e2e.mjs
        timeout-minutes: 3
      - run: node test/e2e-run.mjs
        timeout-minutes: 3
      - run: npm pack --dry-run
